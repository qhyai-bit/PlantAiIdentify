spring:
  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/pai
    username: root
    password: 1234

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 20
          max-wait: 2000
          min-idle: 10
# Knife4j 增强配置
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    swagger-model-name: '实体类列表'
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: 'Apache License 2.0 | Copyright  2025 - [杰普软件科技有限公司]'


# 自定义上传配置
upload:
  nginx-file-path: D:\develop\251217-PlantAiIdentify\pai-file-nginx\html
  nginx-server: http://localhost:8999
  file-directory-name: file
  chunk-directory-name: chunk